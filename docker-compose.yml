services:
  api:
    build: ./backend
    container_name: orbitguard-api
    ports: ["8000:8000"]
    volumes:
      - ./backend/artifacts:/app/artifacts
    environment:
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8000}"
    container_name: orbitguard-web
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy
